<!doctype html>
<html lang="ko" data-protected-ebook="aes-gcm-v1">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>전자책 암호 입력 · 조선토지조사사업보고서 추록</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:26px;background:#e9ede4;color:#243c36;font-family:"Malgun Gothic",sans-serif}.card{width:100%;max-width:510px;background:#fbf9f1;border:1px solid #d6d9cd;box-shadow:0 15px 60px #243c3618;padding:42px}.seal{display:inline-block;writing-mode:vertical-rl;padding:10px 8px;background:#a24b3d;color:white;letter-spacing:4px;font-size:17px}.eyebrow{margin:25px 0 12px;font-size:12px;color:#697568;letter-spacing:1px}h1{font-size:28px;line-height:1.55;margin:0 0 12px;letter-spacing:-1px}.sub{font-size:13px;color:#697568;line-height:1.8;margin-bottom:32px}label{display:block;font-size:13px;font-weight:600;margin-bottom:10px}input,button{font:inherit;width:100%;border-radius:4px;min-height:48px}input{background:#fff;border:1px solid #b9c4b6;padding:11px 13px;color:#243c36}button{border:1px solid #243c36;background:#243c36;color:#fbf9f1;padding:12px;cursor:pointer;font-size:14px}button:hover{background:#355448}button:disabled{opacity:.65;cursor:wait}input:focus-visible,button:focus-visible{outline:3px solid #a24b3d;outline-offset:3px}.feedback{min-height:24px;margin:10px 0 14px;color:#a24b3d;font-size:12px;line-height:1.8}.foot{border-top:1px solid #d6d9cd;margin-top:29px;padding-top:18px;font-size:11px;color:#697568;line-height:1.9}@media(max-width:520px){.card{padding:29px}h1{font-size:24px}}
</style></head>
<body><main class="card"><span class="seal" aria-hidden="true">追錄</span><p class="eyebrow">암호로 보호된 전자책</p><h1>조선토지조사<br>사업보고서 추록</h1><p class="sub">일본어 원문 · 한국어 번역 · 쪽별 원문 전사</p>
<form id="unlockForm"><label for="password">접근 암호</label><input id="password" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required autofocus aria-describedby="feedback"><p id="feedback" class="feedback" role="status" aria-live="polite">암호를 입력하면 전자책이 열립니다.</p><button id="unlockButton" type="submit" disabled>전자책 열기</button></form>
<p class="foot">열람을 마치면 책 상단의 ‘잠금’을 눌러 주세요.<br>파일을 다시 열거나 새로고침하면 암호를 다시 입력합니다.</p><noscript>이 전자책을 열려면 브라우저에서 JavaScript를 사용해야 합니다.</noscript></main>
<script id="sealed-payload" type="application/json">__SEALED_PAYLOAD__</script>
<script>
(()=>{
'use strict';
const form=document.getElementById('unlockForm'),field=document.getElementById('password'),feedback=document.getElementById('feedback'),button=document.getElementById('unlockButton');
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
form.addEventListener('submit',async event=>{
 event.preventDefault();if(button.disabled)return;
 if(!globalThis.crypto?.subtle){feedback.textContent='이 브라우저에서는 암호 해제를 지원하지 않습니다. 최신 브라우저로 파일을 열어 주세요.';return;}
 button.disabled=true;field.disabled=true;feedback.textContent='전자책을 여는 중입니다…';
 try{
   const sealed=JSON.parse(document.getElementById('sealed-payload').textContent);
   const secret=new TextEncoder().encode(field.value);field.value='';
   const material=await crypto.subtle.importKey('raw',secret,'PBKDF2',false,['deriveKey']);secret.fill(0);
   const accessKey=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(sealed.salt),iterations:sealed.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
   const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(sealed.iv),additionalData:new TextEncoder().encode(sealed.aad),tagLength:128},accessKey,decode(sealed.ciphertext));
   const restored=new TextDecoder('utf-8',{fatal:true}).decode(bytes);
   document.open();document.write(restored);document.close();
 }catch(error){
   feedback.textContent='암호가 올바르지 않습니다. 다시 입력해 주세요.';
   button.disabled=false;field.disabled=false;field.value='';field.focus();
 }
});
button.disabled=false;
})();
</script></body></html>
